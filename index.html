<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atalhos do VS Code</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #007acc; }
        ul { list-style: none; padding: 0; }
        li { background: #f4f4f4; margin: 10px 0; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; }
        kbd { background: #ddd; border-radius: 3px; padding: 2px 6px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Guia de Atalhos - VS Code</h1>
    <p>Principais comandos para aumentar a produtividade no editor:</p>
    <ul>
        <li><span>Abrir o Terminal Integrado</span> <kbd>Ctrl + `</kbd></li>
        <li><span>Buscar arquivos por nome</span> <kbd>Ctrl + P</kbd></li>
        <li><span>Paleta de Comandos</span> <kbd>Ctrl + Shift + P</kbd></li>
        <li><span>Salvar o arquivo atual</span> <kbd>Ctrl + S</kbd></li>
        <li><span>Comentar linha de código</span> <kbd>Ctrl + ;</kbd></li>
    </ul>
</body>
</html>
